name: operator-world-ci

on:
  push:
  pull_request:

jobs:
  selftest:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -r requirements.txt
      - name: Operator plate selftest
        run: python operator_plate.py
      - name: SplatWorld3 bridge selftest
        run: python splatworld3.py --selftest
